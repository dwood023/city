[package]
name = "city-builder"
version = "0.1.0"
edition = "2024"
description = "A city builder inspired by Cities: Skylines, built with Bevy. Started from the official bevy_city example (procedurally generated city)."
license = "MIT OR Apache-2.0"

[dependencies]
# Bevy with no extra features: the camera is custom (orthographic rig), assets
# are procedural, and there's no UI framework. Keep the feature set minimal so
# the first build stays as small as possible.
bevy = "0.19.1"

argh = "0.1"
# First-party Bevy diagnostics (frame time / FPS / entity count). Only used by
# the `--diagnostics` profiling flag; already compiled as a Bevy sub-crate, so
# it adds no meaningful build time.
bevy_diagnostic = "0.19.1"
# Lyon: 2D path tessellation. Used to stroke road centerlines into filled
# ribbons with round joins/caps (consistent width at turns and T-junctions).
lyon_path = "1.0"
lyon_tessellation = "1.0"

# --- Ultrabook-friendly profiles -------------------------------------------
#
# Bevy's official "fast compiles" recommendation. `opt-level = 1` for our own
# code keeps iterative builds quick, while dependencies (i.e. Bevy itself) are
# compiled at opt-level 3 so runtime performance stays decent. Dependencies are
# only compiled once, so the extra first-build time is paid once and amortized
# over every later build.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Release profile: keep it snappy for distribution. First release build will be
# slow on an ultrabook; that's expected.
[profile.release]
lto = "thin"
strip = true
